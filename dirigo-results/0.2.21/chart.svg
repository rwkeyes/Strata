<text x='34' y='966' font-size='11.5' fill='#6b7280'>Source: dirigo-results/0.2.21/guidellm/guidellm-gl0221*.json and -gs0221*.json (mean of two runs), turnaround/probe-*.json.  Recompute: scripts/make-chart.py</text>
<text x='34' y='983' font-size='11.5' fill='#6b7280'>Same-arm repeat spread on this rig: 4 % at one and two streams, 7–9 % at four and eight — the eight-stream row is inside it.</text>
<text x='34' y='1000' font-size='11.5' fill='#6b7280'>GuideLLM sends unique prompts, so the fork's cache-off path applies; a conversation switches the cache back on.</text>
<text x='34' y='1017' font-size='11.5' font-weight='600' fill='#1f2430'>Both arms ran one request at a time (--batch 0): at eight concurrent clients the two servers are queueing, and the first-token gap closes.</text>
