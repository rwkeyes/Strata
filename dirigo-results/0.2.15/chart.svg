<text x='34' y='980' font-size='11.5' fill='#6b7280'>Source: dirigo-results/0.2.15/guidellm/guidellm-0215ab-d0215.json and -s0215.json, medians of the per-request samples; battery/*.json. Recompute with scripts/make-chart.py.</text>
<text x='34' y='997' font-size='11.5' fill='#6b7280'>One pass per arm in one session; positional drift in this rig measured 2–4 % on the 0.2.12→0.2.13 pair, and the same legs re-run on 0.2.14 land within 0.5 % of these. GuideLLM sends unique prompts, so the fork's cache-off path applies — a conversation switches the cache back on.</text>
<text x='34' y='1014' font-size='11.5' font-weight='600' fill='#1f2430'>Single-user figures: both arms ran one request at a time, so the advantage falls to zero at eight concurrent clients, where the two servers are queueing.</text>
